# ============================================================
# 云端构建 Android APK
#
# Flutter 工程在子目录 offroad_light/，所以下面用 working-directory 指过去；
# 但 .github/workflows/ 必须放在仓库根目录，GitHub Actions 只认这个位置。
#
# 本地那套 Flutter 太旧(3.29.2)，装不上新版依赖，所以构建走云端最新 stable。
#
# 用法：
#   1. 推送到 main 分支自动触发；
#   2. 也可在 Actions 页面 → 选本工作流 → Run workflow 手动触发。
#   3. 跑完在该次运行页面底部 Artifacts 下载 SPOTLIGHT-android，直接装手机。
# ============================================================

name: 构建 Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: 构建 Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    defaults:
      run:
        working-directory: offroad_light

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态检查
        run: flutter analyze

      # 按 ABI 拆分：每个包比通用包小很多，装机更省空间
      #
      # set -o pipefail 不能少：Actions 的 bash 默认取管道最后一条命令的退出码，
      # 接了 tee 之后 flutter 失败也会被判成成功，构建就白跑了。
      - name: 编译 APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi 2>&1 | tee /tmp/build-split.log

      # 再出一个通用包，不确定手机架构时用这个
      - name: 编译通用 APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee /tmp/build-universal.log

      # GitHub 的运行日志要登录才能看，annotation 却是公开的。
      # 构建挂了就把报错摘成 annotation，不用登录也能直接定位问题。
      - name: 失败时暴露报错
        if: failure()
        shell: bash
        run: |
          for f in /tmp/build-split.log /tmp/build-universal.log; do
            [ -f "$f" ] || continue
            echo "================ $f 尾部 ================"
            tail -c 5000 "$f"
          done
          msg=$(cat /tmp/build-*.log 2>/dev/null \
                | grep -iE "^(FAILURE|error|\* What went wrong|Caused by)|error:|Exception|Unsupported|requires" \
                | tail -25 | tr '\n' '~')
          echo "::error::${msg:-没匹配到错误行，见上面的日志尾部}"

      - name: 上传构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: /tmp/build-*.log
          retention-days: 7

      - name: 列出产物
        run: ls -lh build/app/outputs/flutter-apk/

      # 这里的 path 是相对【仓库根目录】的，不受 working-directory 影响
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: SPOTLIGHT-android
          path: offroad_light/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
