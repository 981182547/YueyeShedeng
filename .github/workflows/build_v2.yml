# ============================================================
# 云端构建 2.0（8 组）App：Android APK + 未签名 iOS IPA
#
# 和 build.yml 是同一套流程，只是工程目录换成 offroad_light_8lutebieban/，
# 产物名前面加了 2，免得和 4 组版的包混在一起。
#
# 只有改到 2.0 的 App 目录（或者这个文件本身）才会触发；
# 也可以在 Actions 页面选本工作流 → Run workflow 手动触发。
# 跑完在运行页面底部 Artifacts 下载 SPOTLIGHT2-android / SPOTLIGHT2-ios-unsigned。
# ============================================================

name: 构建 2.0 Android + iOS（8 组）

on:
  push:
    branches: [main]
    paths:
      - 'offroad_light_8lutebieban/**'
      - '.github/workflows/build_v2.yml'
  workflow_dispatch:

jobs:
  android:
    name: 构建 Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    defaults:
      run:
        working-directory: offroad_light_8lutebieban

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态检查
        run: flutter analyze

      # 按 ABI 拆分：每个包比通用包小很多，装机更省空间
      #
      # set -o pipefail 不能少：Actions 的 bash 默认取管道最后一条命令的退出码，
      # 接了 tee 之后 flutter 失败也会被判成成功，构建就白跑了。
      - name: 编译 APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi 2>&1 | tee /tmp/build-split.log

      # 再出一个通用包，不确定手机架构时用这个
      - name: 编译通用 APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee /tmp/build-universal.log

      # GitHub 的运行日志要登录才能看，annotation 却是公开的。
      # 构建挂了就把报错摘成 annotation，不用登录也能直接定位问题。
      - name: 失败时暴露报错
        if: failure()
        shell: bash
        run: |
          for f in /tmp/build-split.log /tmp/build-universal.log; do
            [ -f "$f" ] || continue
            echo "================ $f 尾部 ================"
            tail -c 5000 "$f"
          done
          msg=$(cat /tmp/build-*.log 2>/dev/null \
                | grep -iE "^(FAILURE|error|\* What went wrong|Caused by)|error:|Exception|Unsupported|requires" \
                | tail -25 | tr '\n' '~')
          echo "::error::${msg:-没匹配到错误行，见上面的日志尾部}"

      - name: 上传构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-v2
          path: /tmp/build-*.log
          retention-days: 7

      - name: 列出产物
        run: ls -lh build/app/outputs/flutter-apk/

      # 这里的 path 是相对【仓库根目录】的，不受 working-directory 影响
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: SPOTLIGHT2-android
          path: offroad_light_8lutebieban/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

  # ---------------- iOS（未签名） ----------------
  #
  # 产出的是【未签名】IPA，只能用 Sideloadly / AltStore 之类的工具侧载自测，
  # 装不进 App Store。上架要等客户的开发者账号下来，配好证书后再改成签名构建。
  #
  # macOS runner 对公开仓库免费，所以不用买 Mac 也能出包。
  ios:
    name: 构建 iOS IPA(未签名)
    runs-on: macos-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: offroad_light_8lutebieban

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 编译 iOS(不签名)
        shell: bash
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee /tmp/build-ios.log

      # 未签名产物手工套一层 Payload 目录压成 ipa，侧载工具认这个结构
      - name: 打包成 .ipa
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r -q SPOTLIGHT2-unsigned.ipa Payload
          rm -rf Payload
          ls -lh SPOTLIGHT2-unsigned.ipa

      - name: 失败时暴露报错
        if: failure()
        shell: bash
        run: |
          [ -f /tmp/build-ios.log ] && tail -c 5000 /tmp/build-ios.log
          msg=$(cat /tmp/build-ios.log 2>/dev/null \
                | grep -iE "^(error|fatal)|error:|Exception|not found|failed" \
                | tail -20 | tr '\n' '~')
          echo "::error::${msg:-没匹配到错误行，见上面的日志尾部}"

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: SPOTLIGHT2-ios-unsigned
          path: offroad_light_8lutebieban/build/ios/ipa/*.ipa
          retention-days: 30
